<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L3 · 컴팩트 리스트 — 로그인 · 배구부 레이아웃 시안</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="variant-nav">
      <a class="back" href="../index.html">← 전체 시안</a>
      <span class="vname">L3 · 컴팩트 리스트</span>
      <a href="login.html">로그인</a>
      <a href="home.html">홈</a>
      <a href="attendance.html">출석</a>
      <a href="team.html">팀</a>
      <a href="my.html">MY</a>
    </nav>

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="top-bar">
            <div>
              <div class="tb-title">배구부</div>
              <div class="tb-sub">당일 출석과 팀 편성, 한 번에</div>
            </div>
          </header>

          <main class="app-content">
            <div class="login-mini">
              <div class="logo">🏐</div>
              <div class="app-name">배구부</div>
              <div class="app-tag">학번과 비밀번호로 로그인</div>
            </div>

            <div class="list-card form-list">
              <div class="f-row">
                <label for="student-number">학번</label>
                <input
                  id="student-number"
                  type="text"
                  inputmode="numeric"
                  placeholder="202312345"
                />
              </div>
              <div class="f-row">
                <label for="password">비밀번호</label>
                <input id="password" type="password" placeholder="비밀번호" />
              </div>
            </div>

            <button type="button" class="btn-primary">로그인</button>
            <p class="note">계정 문의는 회장에게</p>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
