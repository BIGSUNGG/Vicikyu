<!doctype html>
<html lang="ko">

    <nav class="variant-nav">

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="top-bar">
            <div>

              <div class="tb-sub">2026년 3월 26일 목요일</div>
            </div>
            <span class="tb-badge">팀 확정</span>

          <main class="app-content">
            <div class="sec-bar">
              <span class="sb-title">TODAY · 3월 26일</span>
              <span class="sb-more">전체 보기</span>
            </div>
            <div class="list-card">
              <div class="row">
                <div class="r-icon">📅</div>
                <div class="r-main">
                  <div class="r-title">오늘 운동</div>
                  <div class="r-sub">3월 26일 목요일</div>
                </div>
                <div class="r-right">
                  <span class="badge badge-orange">팀 확정</span>
                </div>
              </div>
              <div class="row">
                <div class="r-icon">✅</div>
                <div class="r-main">
                  <div class="r-title">오늘 출석</div>
                  <div class="r-sub">OTP 출석 완료</div>
                </div>
                <div class="r-right">
                  <span class="r-value" style="color: #0d9668">18:32</span>
                </div>
              </div>
              <div class="row">
                <div class="r-icon">🏐</div>
                <div class="r-main">
                  <div class="r-title">오늘 나는 B팀</div>
                  <div class="r-sub">김민서 ★ · 이지훈 · 박서연 외 3명</div>
                </div>
                <span class="chev">›</span>
              </div>
            </div>

            <div class="sec-bar">
              <span class="sb-title">이번 학기</span>
              <span class="sb-more">MY 통계</span>
            </div>
            <div class="list-card">
              <div class="row">
                <div class="r-icon">🏆</div>
                <div class="r-main">
                  <div class="r-title">이번 학기 내 출석</div>
                  <div class="r-sub">출석률 80% (활동 15회 중)</div>
                </div>
                <div class="r-right">
                  <span class="r-value">12회</span>
                  <div class="r-sub" style="margin-top: 2px">5위 / 24명</div>
                </div>
              </div>
              <div class="row">
                <div class="r-icon">💳</div>
                <div class="r-main">
                  <div class="r-title">회비</div>
                  <div class="r-sub">2026-1 학기 회비</div>
                </div>
                <div class="r-right">
                  <span class="badge badge-green">납부 완료</span>
                </div>
              </div>
            </div>
          </main>

          <nav class="bottom-nav">
            <a class="nav-item active" href="home.html"
              ><span class="nav-icon">🏠</span>홈</a
            >
            <a class="nav-item" href="my.html"
