<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 · 바운스 클럽 — 홈 · 배구부 디자인 시안</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="variant-nav">
	<a class="back" href="../index.html">← 전체 시안</a>
	<span class="vname">V4 · 바운스 클럽</span>
	<a href="login.html">로그인</a>
	<a href="home.html">홈</a>
	<a href="attendance.html">출석</a>
	<a href="team.html">팀</a>
	<a href="my.html">MY</a>
</nav>

<div class="stage">
	<div class="phone">
		<div class="screen">
			<header class="app-header">
				<div class="header-row">
					<span class="app-title">🏐 배구부</span>
					<span class="app-sub">2026년 3월 26일 목요일</span>
				</div>
			</header>

			<main class="app-content">
				<div class="card">
					<div class="card-row">
						<div>
							<div class="card-value">오늘 운동</div>
							<div class="member-meta">3월 26일 목요일</div>
						</div>
						<span class="badge badge-orange">팀 확정</span>
					</div>
				</div>

				<div class="card">
					<h2 class="card-title">✅ 오늘 출석</h2>
					<div class="card-row">
						<span class="card-value" style="color:var(--green)">✅ 오늘 출석 완료</span>
						<span class="badge badge-green">18:32 출석</span>
					</div>
				</div>

				<div class="card team-hero">
					<div class="hero-label">🏐 오늘 나는</div>
					<div class="hero-team">B팀</div>
					<div class="chips">
						<span class="team-member-chip mine">김민서 ★</span>
						<span class="team-member-chip">이지훈</span>
						<span class="team-member-chip">박서연</span>
						<span class="team-member-chip">최도현</span>
						<span class="team-member-chip">정하늘</span>
						<span class="team-member-chip">한지민 (게스트)</span>
					</div>
				</div>

				<div class="card">
					<h2 class="card-title">🏆 이번 학기 내 출석</h2>
					<div class="card-row">
						<span class="card-value">12회</span>
						<span class="badge badge-blue">현재 5위 / 24명</span>
					</div>
					<div class="member-meta" style="margin-top:6px">출석률 80% (활동 15회 중)</div>
				</div>

				<div class="card">
					<h2 class="card-title">💳 회비</h2>
					<div class="card-row">
						<span class="card-value" style="font-size:1rem">2026-1 학기 회비</span>
						<span class="badge badge-green">납부 완료</span>
					</div>
				</div>
			</main>

			<nav class="bottom-nav">
				<a class="nav-item active" href="home.html"><span class="nav-icon">🏠</span>홈</a>
				<a class="nav-item" href="my.html"><span class="nav-icon">👤</span>MY</a>
				<a class="nav-item" href="#" title="관리자 전용"><span class="nav-icon">⚙️</span>관리자</a>
			</nav>
		</div>
	</div>
</div>
</body>
</html>
