<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L1 · 타일 보드 — 오늘 출석 · 배구부 레이아웃 시안</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="variant-nav">
      <a class="back" href="../index.html">← 전체 시안</a>
      <span class="vname">L1 · 타일 보드</span>
      <a href="login.html">로그인</a>
      <a href="home.html">홈</a>
      <a href="attendance.html">출석</a>
      <a href="team.html">팀</a>
      <a href="my.html">MY</a>
    </nav>

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="hero-band">
            <div class="hb-label">✅ 오늘 출석</div>
            <div class="hb-title">OTP 입력</div>
            <div class="hb-sub">2026년 3월 26일 목요일 · 출석 중</div>
          </header>

          <main class="app-content">
            <div class="card">
              <div class="otp-focus">
                <div class="of-title">오늘 출석 OTP</div>
                <div class="of-desc">
                  체육관에 게시된<br />4자리 OTP를 입력하세요
                </div>
              </div>
              <div class="otp-boxes">
                <div class="otp-box filled">4</div>
                <div class="otp-box filled">7</div>
                <div class="otp-box"></div>
                <div class="otp-box"></div>
              </div>
              <button type="button" class="btn-primary">출석 확인</button>
            </div>

            <div class="tile-grid">
              <div class="tile sun">
                <div class="t-icon">📅</div>
                <div class="t-label">오늘 운동</div>
                <div class="t-value">3월 26일</div>
              </div>
              <div class="tile lilac">
                <div class="t-icon">⏱️</div>
                <div class="t-label">상태</div>
                <div class="t-value">출석 중</div>
                <div class="t-meta">회장이 마감합니다</div>
              </div>
            </div>

            <p class="note">
              OTP가 맞지 않으면 회장에게 문의하세요<br />출석 마감 후에는 팀이
              편성됩니다
            </p>
          </main>

          <nav class="bottom-nav">
            <a class="nav-item active" href="home.html"
              ><span class="nav-icon">🏠</span>홈</a
            >
            <a class="nav-item" href="my.html"
              ><span class="nav-icon">👤</span>MY</a
            >
            <a class="nav-item" href="#" title="관리자 전용"
              ><span class="nav-icon">⚙️</span>관리자</a
            >
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
