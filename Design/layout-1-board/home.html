<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L1 · 타일 보드 — 홈 · 배구부 레이아웃 시안</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="variant-nav">
      <a class="back" href="../index.html">← 전체 시안</a>
      <span class="vname">L1 · 타일 보드</span>
      <a href="login.html">로그인</a>
      <a href="home.html">홈</a>
      <a href="attendance.html">출석</a>
      <a href="team.html">팀</a>
      <a href="my.html">MY</a>
    </nav>

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="hero-band">
            <div class="hb-label">🏐 오늘 나는</div>
            <div class="hb-title">B팀</div>
            <div class="hb-sub">2026년 3월 26일 목요일 · 팀 확정</div>
          </header>

          <main class="app-content">
            <div class="tile-grid">
              <div class="tile sky">
                <div class="t-icon">📅</div>
                <div class="t-label">오늘 운동</div>
                <div class="t-value">3월 26일</div>
                <div class="t-meta">목요일 · 팀 확정</div>
              </div>
              <div class="tile mint">
                <div class="t-icon">✅</div>
                <div class="t-label">오늘 출석</div>
                <div class="t-value">완료</div>
                <div class="t-meta">18:32 출석</div>
              </div>
              <div class="tile sun">
                <div class="t-icon">🏆</div>
                <div class="t-label">이번 학기</div>
                <div class="t-value">12회 · 5위</div>
                <div class="t-meta">출석률 80% (15회 중)</div>
              </div>
              <div class="tile lilac">
                <div class="t-icon">💳</div>
                <div class="t-label">회비</div>
                <div class="t-value">납부 완료</div>
                <div class="t-meta">2026-1 학기 회비</div>
              </div>
            </div>

            <div class="sec">
              <span class="sec-title">오늘의 팀</span>
              <span class="sec-more">17명 · 3팀</span>
            </div>
            <div class="team-row my">
              <div class="tr-emoji">🏐</div>
              <div>
                <div class="tr-name">B팀 · 나의 팀</div>
                <div class="tr-meta">김민서 ★ 외 5명</div>
              </div>
              <span class="badge badge-orange">6명</span>
            </div>
            <div class="team-row">
              <div class="tr-emoji">🏐</div>
              <div>
                <div class="tr-name">A팀</div>
                <div class="tr-meta">강도윤 외 5명</div>
              </div>
              <span class="badge badge-gray">6명</span>
            </div>
            <div class="team-row">
              <div class="tr-emoji">🏐</div>
              <div>
                <div class="tr-name">C팀</div>
                <div class="tr-meta">배준호 외 4명</div>
              </div>
              <span class="badge badge-gray">5명</span>
            </div>
          </main>

          <nav class="bottom-nav">
            <a class="nav-item active" href="home.html"
              ><span class="nav-icon">🏠</span>홈</a
            >
            <a class="nav-item" href="my.html"
              ><span class="nav-icon">👤</span>MY</a
            >
            <a class="nav-item" href="#" title="관리자 전용"
              ><span class="nav-icon">⚙️</span>관리자</a
            >
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
