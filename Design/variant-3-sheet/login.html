<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 · 화이트 시트 — 로그인 · 배구부 디자인 시안</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="variant-nav">
	<a class="back" href="../index.html">← 전체 시안</a>
	<span class="vname">V3 · 화이트 시트</span>
	<a href="login.html">로그인</a>
	<a href="home.html">홈</a>
	<a href="attendance.html">출석</a>
	<a href="team.html">팀</a>
	<a href="my.html">MY</a>
</nav>

<div class="stage">
	<div class="phone">
		<div class="screen">
			<header class="app-header">
				<div class="header-row">
					<span class="app-title">🏐 배구부</span>
				</div>
			</header>

			<main class="app-content">
				<div class="login-hero">
					<div class="logo">🏐</div>
					<div class="app-name">배구부</div>
					<div class="app-tag">당일 출석과 팀 편성, 한 번에</div>
				</div>

				<div class="card">
					<div class="field">
						<label for="student-number">학번</label>
						<input id="student-number" type="text" inputmode="numeric" placeholder="202312345">
					</div>
					<div class="field">
						<label for="password">비밀번호</label>
						<input id="password" type="password" placeholder="비밀번호">
					</div>
					<button type="button" class="btn-primary">로그인</button>
					<p class="login-foot">학번과 비밀번호로 로그인합니다 · 계정 문의는 회장에게</p>
				</div>
			</main>
		</div>
	</div>
</div>
</body>
</html>
