<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V1 · 코트 오렌지 — 오늘 출석 · 배구부 디자인 시안</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="variant-nav">
      <a class="back" href="../index.html">← 전체 시안</a>
      <span class="vname">V1 · 코트 오렌지</span>
      <a href="login.html">로그인</a>
      <a href="home.html">홈</a>
      <a href="attendance.html">출석</a>
      <a href="team.html">팀</a>
      <a href="my.html">MY</a>
    </nav>

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="app-header">
            <div class="header-row">
              <span class="app-title">✅ 오늘 출석</span>
              <span class="app-sub">2026년 3월 26일 목요일</span>
            </div>
          </header>

          <main class="app-content">
            <div class="card">
              <div class="card-row">
                <div>
                  <div class="card-value">오늘 운동</div>
                  <div class="member-meta">3월 26일 목요일</div>
                </div>
                <span class="badge badge-green">출석 중</span>
              </div>
            </div>

            <div class="card">
              <div class="otp-guide">
                <div class="otp-title">오늘 출석 OTP</div>
                <div class="otp-desc">
                  체육관에 게시된<br />4자리 OTP를 입력하세요
                </div>
              </div>
              <div class="otp-boxes">
                <div class="otp-box filled">4</div>
                <div class="otp-box filled">7</div>
                <div class="otp-box"></div>
                <div class="otp-box"></div>
              </div>
              <button type="button" class="btn-primary">출석 확인</button>
            </div>

            <p class="note">
              OTP가 맞지 않으면 회장에게 문의하세요<br />출석 마감 후에는 팀이
              편성됩니다
            </p>
          </main>

          <nav class="bottom-nav">
            <a class="nav-item active" href="home.html"
              ><span class="nav-icon">🏠</span>홈</a
            >
            <a class="nav-item" href="my.html"
              ><span class="nav-icon">👤</span>MY</a
            >
            <a class="nav-item" href="#" title="관리자 전용"
              ><span class="nav-icon">⚙️</span>관리자</a
            >
          </nav>
        </div>
      </div>
    </div>
  </body>
