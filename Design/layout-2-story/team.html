<!doctype html>
<html lang="ko">
  <head>

    <link rel="stylesheet" href="style.css" />

  <body>
    <nav class="variant-nav">

    <div class="stage">
      <div class="phone">
        <div class="screen">
          <header class="hero-full">

            <div class="hf-label">🏐 오늘의 팀</div>
            <div class="hf-title">B팀</div>
            <div class="hf-chips">

            </div>
          </header>

          <main class="app-content" style="gap: 8px">
            <div class="carousel-head">
              <span class="ch-title">팀 카드를 옆으로 넘겨보세요 →</span>

            <div class="carousel">
              <div class="crd mine">
                <div class="crd-head">
                  <span class="crd-name">🏐 B팀</span>
                  <span class="badge badge-orange">6명</span>

                <div class="chips">

                  <span class="team-member-chip">이지훈</span>
                  <span class="team-member-chip">박서연</span>
                  <span class="team-member-chip">최도현</span>

                </div>
                <div class="crd-hint">나의 팀 · 첫 카드에 고정</div>
              </div>

              <div class="crd">
                <div class="crd-head">
                  <span class="crd-name">🏐 A팀</span>
                  <span class="badge badge-gray">6명</span>
                </div>
                <div class="chips">
                  <span class="team-member-chip">강도윤</span>
                  <span class="team-member-chip">신예은</span>
                  <span class="team-member-chip">오지호</span>
                  <span class="team-member-chip">문성빈</span>
                  <span class="team-member-chip">권태양</span>
                  <span class="team-member-chip">윤채원</span>
                </div>
              </div>

              <div class="crd">
                <div class="crd-head">
                  <span class="crd-name">🏐 C팀</span>
                  <span class="badge badge-gray">5명</span>
                </div>
                <div class="chips">
                  <span class="team-member-chip">배준호</span>
                  <span class="team-member-chip">송하린</span>
                  <span class="team-member-chip">임건우</span>
                  <span class="team-member-chip">차별이</span>
                  <span class="team-member-chip">하온 (게스트)</span>
                </div>
              </div>

            <p class="note">
              팀은 오늘 출석 인원으로 랜덤 편성되며<br />회장이 확정하면
              전원에게 표시됩니다
            </p>

          <nav class="bottom-nav">
            <a class="nav-item active" href="home.html"

            <a class="nav-item" href="my.html"
